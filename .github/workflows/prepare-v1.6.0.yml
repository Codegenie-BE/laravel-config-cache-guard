name: Prepare v1.6.0 release

on:
  push:
    branches:
      - release/v1.6.0

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.6.0
          fetch-depth: 0

      - name: Prepare changelog and branch cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          start = text.index('## Unreleased')
          next_release = text.index('## v1.5.1 - 2026-08-17')
          notes = text[start + len('## Unreleased'):next_release].strip()
          if not notes.startswith('- '):
              raise SystemExit('Expected v1.6.0 release notes under Unreleased')
          replacement = '## Unreleased\n\n## v1.6.0 - 2026-08-20\n\n' + notes + '\n\n'
          changelog.write_text(text[:start] + replacement + text[next_release:])

          workflow = Path('.github/workflows/tests.yml')
          yml = workflow.read_text().rstrip() + '\n'
          marker = '      - name: Delete fully merged non-main branches\n'
          if marker not in yml:
              yml += '''\n      - name: Delete fully merged non-main branches
        if: steps.release.outputs.verify == 'true'
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \\
            | while read -r branch; do
                if [ -z "${branch}" ] || [ "${branch}" = "main" ] || [ "${branch}" = "HEAD" ]; then
                  continue
                fi

                if git merge-base --is-ancestor "origin/${branch}" origin/main; then
                  echo "Deleting fully merged branch ${branch}."
                  git push origin --delete "${branch}"
                fi
              done
'''
          workflow.write_text(yml)
          PY

      - name: Commit release preparation and remove helper
        shell: bash
        run: |
          git rm .github/workflows/prepare-v1.6.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/tests.yml
          git commit -m "chore: prepare v1.6.0"
          git push origin HEAD:release/v1.6.0
