name: Cleanup merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete fully merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Delete fully merged non-main branches
        shell: bash
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
            | while read -r branch; do
                if [ -z "${branch}" ] || [ "${branch}" = "main" ] || [ "${branch}" = "HEAD" ]; then
                  continue
                fi

                branch_sha="$(git rev-parse "refs/remotes/origin/${branch}")"

                if git merge-base --is-ancestor "${branch_sha}" origin/main; then
                  echo "Deleting fully merged branch ${branch} at ${branch_sha}."

                  if ! git push \
                    --force-with-lease="refs/heads/${branch}:${branch_sha}" \
                    origin ":refs/heads/${branch}"; then
                    echo "Keeping ${branch}: its remote tip changed after validation."
                  fi
                else
                  echo "Keeping unmerged branch ${branch}."
                fi
              done
