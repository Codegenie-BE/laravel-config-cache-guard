name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: Determine next version
        id: release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          tag="$(php tests/Support/next-release-tag.php "${RELEASE_BUMP}")"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Prepare and validate changelog
        run: |
          php tests/Support/prepare-release.php "${{ steps.release.outputs.tag }}"
          php tests/Support/validate-release-tag.php "${{ steps.release.outputs.tag }}"

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          branch="release/${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git add CHANGELOG.md
          git commit --message "chore: prepare ${RELEASE_TAG}"
          git push --set-upstream origin "${branch}"

          pr_url="$(gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: prepare ${RELEASE_TAG}" \
            --body "Prepare ${RELEASE_TAG} from the validated Unreleased changelog. Once the required CI gate succeeds, this pull request is merged automatically and the protected main workflow publishes the GitHub release and Packagist version.")"

          # Pull requests opened with GITHUB_TOKEN require explicit workflow dispatch.
          # Running tests.yml for the release branch creates the required CI gate on
          # the exact pull-request head commit without relying on recursive events.
          gh workflow run tests.yml --ref "${branch}"
          gh pr merge "${pr_url}" --auto --squash --delete-branch

          {
            echo "## ${RELEASE_TAG} release pull request created"
            echo
            echo "[Open the release pull request](${pr_url})."
            echo
            echo "The complete test workflow was dispatched explicitly. Auto-merge is enabled and remains blocked until the required CI gate passes. After merge, protected main publishes ${RELEASE_TAG} to GitHub and Packagist automatically."
          } >> "$GITHUB_STEP_SUMMARY"
