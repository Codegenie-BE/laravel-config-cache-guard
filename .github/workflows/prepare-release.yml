name: Prepare release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: Determine next version
        id: release
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          tag="$(php tests/Support/next-release-tag.php "${RELEASE_BUMP}")"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Prepare and validate changelog
        run: |
          php tests/Support/prepare-release.php "${{ steps.release.outputs.tag }}"
          php tests/Support/validate-release-tag.php "${{ steps.release.outputs.tag }}"

      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          branch="release/${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git add CHANGELOG.md
          git commit --message "chore: prepare ${RELEASE_TAG}"
          release_sha="$(git rev-parse HEAD)"
          git push --set-upstream origin "${branch}"

          pr_url="$(gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: prepare ${RELEASE_TAG}" \
            --body "Prepare ${RELEASE_TAG} from the validated Unreleased changelog. Once the required CI gate succeeds, this pull request is merged automatically and the protected main workflow publishes the GitHub release and Packagist version.")"

          # GitHub creates pull-request workflows opened by GITHUB_TOKEN in an
          # approval-required state. Approve only the Tests run for the exact
          # release commit so its CI gate is associated with this pull request.
          approval_run_id=""
          for attempt in {1..12}; do
            approval_run_id="$(gh run list \
              --workflow tests.yml \
              --branch "${branch}" \
              --event pull_request \
              --limit 20 \
              --json databaseId,conclusion,headSha \
              --jq ".[] | select(.headSha == \"${release_sha}\" and .conclusion == \"action_required\") | .databaseId" \
              | head -n 1)"

            if [ -n "${approval_run_id}" ]; then
              break
            fi

            sleep 5
          done

          if [ -z "${approval_run_id}" ]; then
            echo "No approval-required Tests run appeared for ${release_sha}."
            exit 1
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${approval_run_id}/approve"
          gh pr merge "${pr_url}" --auto --squash

          # A merge performed by GITHUB_TOKEN does not emit a recursive push run.
          # Keep this job alive until auto-merge completes, then dispatch protected
          # main explicitly so the release job can publish the prepared version.
          merged=false
          for attempt in {1..180}; do
            pr_state="$(gh pr view "${pr_url}" --json state --jq '.state')"

            if [ "${pr_state}" = "MERGED" ]; then
              merged=true
              break
            fi

            if [ "${pr_state}" = "CLOSED" ]; then
              echo "The release pull request closed without merging."
              exit 1
            fi

            sleep 5
          done

          if [ "${merged}" != "true" ]; then
            echo "Timed out waiting for the release pull request to auto-merge."
            exit 1
          fi

          # gh cannot defer --delete-branch until a future auto-merge. Delete the
          # exact generated release branch only after GitHub reports it as merged.
          git push origin --delete "${branch}"
          gh workflow run tests.yml --ref main

          {
            echo "## ${RELEASE_TAG} release pull request merged"
            echo
            echo "[Open the release pull request](${pr_url})."
            echo
            echo "The pull-request workflow was approved for the exact release commit and auto-merge remained blocked until its required CI gate passed. Protected main was then dispatched explicitly to publish ${RELEASE_TAG} to GitHub and Packagist."
          } >> "$GITHUB_STEP_SUMMARY"
