name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.5'
            laravel: '12'
            testbench: '^10.0'
            pest: '^3.0'
          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'
            pest: '^4.0'
          - php: '8.5'
            laravel: '13'
            testbench: '^11.0'
            pest: '^4.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer check:composer

      - name: Validate supported runtime versions
        run: composer check:support

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-laravel-${{ matrix.laravel }}-
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Pin Laravel test dependencies
        run: composer require --dev orchestra/testbench:"${{ matrix.testbench }}" pestphp/pest:"${{ matrix.pest }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction

      - name: Audit dependencies
        run: composer check:security

      - name: Validate optimized autoload
        run: composer check:autoload

      - name: Run Pint
        run: composer format:test

      - name: Run PHPStan
        run: composer analyse

      - name: Run tests
        run: composer test

  windows-portability:
    name: Windows / PHP 8.2 / Laravel 12
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run all quality gates
        run: composer check

  end-to-end:
    name: E2E / ${{ matrix.platform }} / PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            php: '8.2'
            laravel: '12'
          - os: ubuntu-latest
            platform: Linux
            php: '8.3'
            laravel: '13'
          - os: windows-latest
            platform: Windows
            php: '8.2'
            laravel: '12'

    env:
      COMPOSER_CACHE_DIR: ${{ runner.temp }}/composer-cache
      COMPOSER_PROCESS_TIMEOUT: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: e2e-${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            e2e-${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-
            e2e-${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install package development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run real Laravel application end-to-end tests
        run: composer test:e2e -- --laravel=${{ matrix.laravel }}
