name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests / ${{ matrix.platform.name }} / PHP ${{ matrix.runtime.php }} / Laravel ${{ matrix.runtime.laravel }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x64
            runner: ubuntu-latest
          - name: Windows x64
            runner: windows-latest
          - name: macOS ARM64
            runner: macos-latest
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
        runtime:
          - php: '8.2'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.3'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.4'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.5'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.3'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'
          - php: '8.4'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'
          - php: '8.5'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'
        exclude:
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.3', laravel: '12', testbench: '~10.0', pest: '~3.0'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.4', laravel: '12', testbench: '~10.0', pest: '~3.0'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.5', laravel: '12', testbench: '~10.0', pest: '~3.0'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.3', laravel: '13', testbench: '~11.0', pest: '~4.0'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.4', laravel: '13', testbench: '~11.0', pest: '~4.0'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.3', laravel: '12', testbench: '~10.0', pest: '~3.0'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.4', laravel: '12', testbench: '~10.0', pest: '~3.0'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.5', laravel: '12', testbench: '~10.0', pest: '~3.0'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.3', laravel: '13', testbench: '~11.0', pest: '~4.0'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.4', laravel: '13', testbench: '~11.0', pest: '~4.0'}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.runtime.php }}
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Validate composer.json
        run: composer check:composer

      - name: Validate supported runtime versions
        run: composer check:support

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: ${{ matrix.platform.runner }}-composer-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ matrix.platform.runner }}-composer-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-
            ${{ matrix.platform.runner }}-composer-${{ matrix.runtime.php }}-
            ${{ matrix.platform.runner }}-composer-

      - name: Pin Laravel test dependencies
        run: composer require --dev 'orchestra/testbench:${{ matrix.runtime.testbench }}' 'pestphp/pest:${{ matrix.runtime.pest }}' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction

      - name: Audit dependencies
        run: composer check:security

      - name: Validate package distribution
        if: matrix.platform.runner == 'ubuntu-latest' && matrix.runtime.php == '8.2' && matrix.runtime.laravel == '12'
        run: composer check:distribution

      - name: Validate optimized autoload
        run: composer check:autoload

      - name: Run Pint
        run: composer format:test

      - name: Run PHPStan
        run: composer analyse

      - name: Run tests
        run: composer test

  end-to-end:
    name: E2E / ${{ matrix.platform.name }} / PHP ${{ matrix.runtime.php }} / Laravel ${{ matrix.runtime.laravel }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache
      COMPOSER_PROCESS_TIMEOUT: 0

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x64
            runner: ubuntu-latest
          - name: Windows x64
            runner: windows-latest
          - name: macOS ARM64
            runner: macos-latest
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
        runtime:
          - php: '8.2'
            laravel: '12'
          - php: '8.3'
            laravel: '12'
          - php: '8.4'
            laravel: '12'
          - php: '8.5'
            laravel: '12'
          - php: '8.3'
            laravel: '13'
          - php: '8.4'
            laravel: '13'
          - php: '8.5'
            laravel: '13'
        exclude:
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.2', laravel: '12'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.3', laravel: '12'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.4', laravel: '12'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.5', laravel: '12'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.3', laravel: '13'}
          - platform: {name: macOS ARM64, runner: macos-latest}
            runtime: {php: '8.4', laravel: '13'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.2', laravel: '12'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.3', laravel: '12'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.4', laravel: '12'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.5', laravel: '12'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.3', laravel: '13'}
          - platform: {name: Linux ARM64, runner: ubuntu-24.04-arm}
            runtime: {php: '8.4', laravel: '13'}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.runtime.php }}
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Cache Composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: e2e-${{ matrix.platform.runner }}-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            e2e-${{ matrix.platform.runner }}-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-
            e2e-${{ matrix.platform.runner }}-php-${{ matrix.runtime.php }}-

      - name: Install package development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run real Laravel application end-to-end tests
        run: composer test:e2e -- --laravel=${{ matrix.runtime.laravel }}

  alpine-tests:
    name: Tests / Alpine Linux x64 / PHP ${{ matrix.runtime.php }} / Laravel ${{ matrix.runtime.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php: '8.2'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.5'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: alpine-composer-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-${{ hashFiles('composer.json', '.github/docker/php-alpine.Dockerfile') }}
          restore-keys: |
            alpine-composer-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-
            alpine-composer-php-${{ matrix.runtime.php }}-

      - name: Build Alpine PHP image
        run: docker build --build-arg PHP_VERSION=${{ matrix.runtime.php }} --tag config-cache-guard-alpine:${{ strategy.job-index }} --file .github/docker/php-alpine.Dockerfile .

      - name: Validate and test package on Alpine
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/package"
          --volume "${{ env.COMPOSER_CACHE_DIR }}:/composer-cache"
          --env COMPOSER_CACHE_DIR=/composer-cache
          config-cache-guard-alpine:${{ strategy.job-index }}
          sh -lc 'composer check:composer && composer check:support && composer require --dev orchestra/testbench:"${{ matrix.runtime.testbench }}" pestphp/pest:"${{ matrix.runtime.pest }}" --no-update --no-interaction && composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress && composer check:security && composer check:autoload && composer format:test && composer analyse && composer test'

  alpine-end-to-end:
    name: E2E / Alpine Linux x64 / PHP ${{ matrix.runtime.php }} / Laravel ${{ matrix.runtime.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache
      COMPOSER_PROCESS_TIMEOUT: 0

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php: '8.5'
            laravel: '13'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: alpine-e2e-composer-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-${{ hashFiles('composer.json', '.github/docker/php-alpine.Dockerfile') }}
          restore-keys: |
            alpine-e2e-composer-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-
            alpine-e2e-composer-php-${{ matrix.runtime.php }}-

      - name: Build Alpine PHP image
        run: docker build --build-arg PHP_VERSION=${{ matrix.runtime.php }} --tag config-cache-guard-alpine-e2e:${{ strategy.job-index }} --file .github/docker/php-alpine.Dockerfile .

      - name: Run real Laravel application end-to-end tests on Alpine
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/package"
          --volume "${{ env.COMPOSER_CACHE_DIR }}:/composer-cache"
          --env COMPOSER_CACHE_DIR=/composer-cache
          --env COMPOSER_PROCESS_TIMEOUT=0
          config-cache-guard-alpine-e2e:${{ strategy.job-index }}
          sh -lc 'composer install --prefer-dist --no-interaction --no-progress && composer test:e2e -- --laravel=${{ matrix.runtime.laravel }}'

  minimum-dependencies:
    name: Minimum dependencies / PHP ${{ matrix.runtime.php }} / Laravel ${{ matrix.runtime.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php: '8.2'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.3'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.runtime.php }}
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Pin Laravel test dependencies
        run: composer require --dev 'orchestra/testbench:${{ matrix.runtime.testbench }}' 'pestphp/pest:${{ matrix.runtime.pest }}' --no-update --no-interaction

      - name: Install minimum supported dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Validate minimum dependency runtime
        run: |
          composer check:support
          composer check:composer
          composer check:security
          composer check:autoload
          composer test

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Skip outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "Dependency review only applies to pull requests."

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
          extensions: fileinfo

      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:~11.0' 'pestphp/pest:~4.0' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Enforce coverage baseline
        run: composer test:coverage

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - tests
      - end-to-end
      - alpine-tests
      - alpine-end-to-end
      - minimum-dependencies
      - dependency-review
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify every required job succeeded
        env:
          REQUIRED_RESULTS: ${{ toJson(needs) }}
        run: |
          if ! jq --exit-status 'all(.[]; .result == "success")' <<< "$REQUIRED_RESULTS"; then
            jq --raw-output 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$REQUIRED_RESULTS"
            exit 1
          fi

  release:
    name: Publish pending release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: fileinfo, zip

      - name: Detect pending changelog release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Only the current main commit may be released."
            exit 1
          fi

          tag="$(php tests/Support/detect-release.php)"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_commit="$(git rev-list --max-count=1 "${tag}")"

            if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
              {
                echo "tag=${tag}"
                echo "publish=false"
                echo "verify=false"
                echo "create-tag=false"
              } >> "$GITHUB_OUTPUT"
              echo "${tag} is already published from an earlier main commit."
              exit 0
            fi

            if gh release view "${tag}" >/dev/null 2>&1; then
              {
                echo "tag=${tag}"
                echo "publish=false"
                echo "verify=true"
                echo "create-tag=false"
              } >> "$GITHUB_OUTPUT"
              echo "${tag} is already released; Packagist will be verified."
              exit 0
            fi

            {
              echo "tag=${tag}"
              echo "publish=true"
              echo "verify=true"
              echo "create-tag=false"
            } >> "$GITHUB_OUTPUT"
            echo "${tag} already exists on this commit; release publication will resume."
            exit 0
          fi

          php tests/Support/validate-release-tag.php "${tag}"
          {
            echo "tag=${tag}"
            echo "publish=true"
            echo "verify=true"
            echo "create-tag=true"
          } >> "$GITHUB_OUTPUT"
          echo "${tag} will be published from $(git rev-parse HEAD)."

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Validate release tag and changelog
        if: steps.release.outputs.publish == 'true'
        run: php tests/Support/validate-release-tag.php "${{ steps.release.outputs.tag }}"

      - name: Run source quality gate
        if: steps.release.outputs.publish == 'true'
        run: composer check

      - name: Build release archive
        if: steps.release.outputs.publish == 'true'
        run: |
          mkdir --parents dist
          composer archive --format=zip --dir=dist --file="laravel-config-cache-guard-${{ steps.release.outputs.tag }}"

      - name: Test the exact release archive
        if: steps.release.outputs.publish == 'true'
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: php tests/E2E/LaravelConfigCacheGuardE2e.php --package-archive="dist/laravel-config-cache-guard-${{ steps.release.outputs.tag }}.zip"

      - name: Build release checksum
        if: steps.release.outputs.publish == 'true'
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS

      - name: Upload workflow artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laravel-config-cache-guard-${{ steps.release.outputs.tag }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attest release provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS

      - name: Create annotated release tag
        if: steps.release.outputs.create-tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${{ steps.release.outputs.tag }}" --message "${{ steps.release.outputs.tag }}" "${GITHUB_SHA}"
          git push origin "refs/tags/${{ steps.release.outputs.tag }}"

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}"
          dist/*.zip
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "${{ steps.release.outputs.tag }}"

      - name: Verify Packagist publication
        if: steps.release.outputs.verify == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "https://packagist.org/packages/codegenie-be/laravel-config-cache-guard.json" \
              | jq --exit-status \
                --arg tag "${RELEASE_TAG}" \
                --arg commit "${RELEASE_COMMIT}" \
                '.package.versions[$tag].source.reference == $commit' >/dev/null; then
              echo "Packagist exposes ${RELEASE_TAG} at ${RELEASE_COMMIT}."
              exit 0
            fi

            echo "Waiting for Packagist (${attempt}/30)..."
            sleep 10
          done

          echo "Packagist did not expose ${RELEASE_TAG} at ${RELEASE_COMMIT} within five minutes."
          exit 1
