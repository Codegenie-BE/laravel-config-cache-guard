name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: CI plan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      full: ${{ steps.changes.outputs.full }}
      release: ${{ steps.changes.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Determine required coverage
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          full=true
          release=false

          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            base="$BASE_SHA"
            head="$(git rev-parse HEAD)"

            if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              full=false

              while IFS= read -r file; do
                [ -z "$file" ] && continue

                case "$file" in
                  README.md|CHANGELOG.md|ADOPTERS.md|CODE_OF_CONDUCT.md|CONTRIBUTING.md|LICENSE.md|SECURITY.md|SUPPORT.md|docs/*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md)
                    ;;
                  *)
                    full=true
                    ;;
                esac
              done < <(git diff --name-only "$base" "$head")

              if [ "$EVENT_NAME" = "pull_request" ] && [[ "$HEAD_REF" == release/* ]]; then
                full=true
              fi

              if git diff --unified=0 "$base" "$head" -- CHANGELOG.md \
                | grep --extended-regexp --quiet '^\+## v[0-9]+\.[0-9]+\.[0-9]+ - [0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
                release=true
                full=true
              fi
            fi
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
            full=true
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "full=$full release=$release"

  quality:
    name: Quality / Linux x64 / PHP 8.5 / Laravel 13
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: quality-composer-php-8.5-laravel-13-${{ hashFiles('composer.json') }}
          restore-keys: |
            quality-composer-php-8.5-laravel-13-
            quality-composer-

      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:~11.0' 'pestphp/pest:~4.0' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Run complete quality gate
        run: composer check

  compatibility:
    name: Compatibility / Linux x64 / PHP ${{ matrix.runtime.php }} / Laravel ${{ matrix.runtime.laravel }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php: '8.2'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.3'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.4'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.5'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.3'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'
          - php: '8.4'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'
          - php: '8.5'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.runtime.php }}
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: compatibility-composer-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            compatibility-composer-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-
            compatibility-composer-php-${{ matrix.runtime.php }}-

      - name: Pin Laravel test dependencies
        run: composer require --dev 'orchestra/testbench:${{ matrix.runtime.testbench }}' 'pestphp/pest:${{ matrix.runtime.pest }}' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Run package tests
        run: composer test

  end-to-end:
    name: E2E / Linux x64 / PHP ${{ matrix.runtime.php }} / Laravel ${{ matrix.runtime.laravel }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache
      COMPOSER_PROCESS_TIMEOUT: 0

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php: '8.2'
            laravel: '12'
          - php: '8.3'
            laravel: '13'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.runtime.php }}
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Cache Composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: e2e-linux-composer-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            e2e-linux-composer-php-${{ matrix.runtime.php }}-laravel-${{ matrix.runtime.laravel }}-
            e2e-linux-composer-

      - name: Install package development dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run real Laravel application end-to-end tests
        run: composer test:e2e -- --laravel=${{ matrix.runtime.laravel }}

  portability:
    name: Portability / ${{ matrix.platform.name }} / PHP 8.5 / Laravel 12 + 13
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 40

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache
      COMPOSER_PROCESS_TIMEOUT: 0

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            runner: windows-latest
          - name: macOS ARM64
            runner: macos-latest
          - name: Linux ARM64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP once
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Cache Composer dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: portability-${{ matrix.platform.runner }}-php-8.5-${{ hashFiles('composer.json') }}
          restore-keys: |
            portability-${{ matrix.platform.runner }}-php-8.5-
            portability-${{ matrix.platform.runner }}-

      - name: Test Laravel 12 on the existing runner
        run: |
          composer require --dev 'orchestra/testbench:~10.0' 'pestphp/pest:~3.0' --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
          composer test
          composer test:e2e -- --laravel=12 --suite=smoke

      - name: Reset dependency manifests
        run: |
          git checkout -- composer.json
          php -r "if (is_file('composer.lock')) { unlink('composer.lock'); }"

      - name: Test Laravel 13 on the same runner
        run: |
          composer require --dev 'orchestra/testbench:~11.0' 'pestphp/pest:~4.0' --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress
          composer test
          composer test:e2e -- --laravel=13 --suite=smoke

  alpine-portability:
    name: Portability / Alpine Linux x64 / PHP 8.5 / Laravel 12 + 13
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/../.composer-cache
      COMPOSER_PROCESS_TIMEOUT: 0

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: alpine-portability-composer-php-8.5-${{ hashFiles('composer.json', '.github/docker/php-alpine.Dockerfile') }}
          restore-keys: |
            alpine-portability-composer-php-8.5-
            alpine-portability-composer-

      - name: Build Alpine PHP environment once
        run: docker build --build-arg PHP_VERSION=8.5 --tag config-cache-guard-alpine:portability --file .github/docker/php-alpine.Dockerfile .

      - name: Test Laravel 12 and 13 in the same Alpine environment
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/package"
          --volume "${{ env.COMPOSER_CACHE_DIR }}:/composer-cache"
          --env COMPOSER_CACHE_DIR=/composer-cache
          --env COMPOSER_PROCESS_TIMEOUT=0
          config-cache-guard-alpine:portability
          sh -lc 'composer require --dev orchestra/testbench:"~10.0" pestphp/pest:"~3.0" --no-update --no-interaction && composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress && composer test && composer test:e2e -- --laravel=12 --suite=smoke && git checkout -- composer.json && rm -f composer.lock && composer require --dev orchestra/testbench:"~11.0" pestphp/pest:"~4.0" --no-update --no-interaction && composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress && composer test && composer test:e2e -- --laravel=13 --suite=smoke'

  minimum-dependencies:
    name: Minimum dependencies / PHP ${{ matrix.runtime.php }} / Laravel ${{ matrix.runtime.laravel }}
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - php: '8.2'
            laravel: '12'
            testbench: '~10.0'
            pest: '~3.0'
          - php: '8.3'
            laravel: '13'
            testbench: '~11.0'
            pest: '~4.0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.runtime.php }}
          coverage: none
          tools: composer:v2
          extensions: fileinfo

      - name: Pin Laravel test dependencies
        run: composer require --dev 'orchestra/testbench:${{ matrix.runtime.testbench }}' 'pestphp/pest:${{ matrix.runtime.pest }}' --no-update --no-interaction

      - name: Install minimum supported dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Validate minimum dependency runtime
        run: |
          composer check:support
          composer check:composer
          composer check:security
          composer check:autoload
          composer test

  dependency-review:
    name: Dependency review
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  coverage:
    name: Coverage
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
          extensions: fileinfo

      - name: Pin Laravel 13 test dependencies
        run: composer require --dev 'orchestra/testbench:~11.0' 'pestphp/pest:~4.0' --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Enforce coverage baseline
        run: composer test:coverage

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - plan
      - quality
      - compatibility
      - end-to-end
      - portability
      - alpine-portability
      - minimum-dependencies
      - dependency-review
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify every required job succeeded or was intentionally skipped
        env:
          REQUIRED_RESULTS: ${{ toJson(needs) }}
        run: |
          if ! jq --exit-status 'all(.[]; .result == "success" or .result == "skipped")' <<< "$REQUIRED_RESULTS"; then
            jq --raw-output 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$REQUIRED_RESULTS"
            exit 1
          fi

  release:
    name: Publish pending release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - plan
      - ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
          extensions: fileinfo, zip

      - name: Detect pending changelog release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Only the current main commit may be released."
            exit 1
          fi

          tag="$(php tests/Support/detect-release.php)"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_commit="$(git rev-list --max-count=1 "${tag}")"

            if [ "$tag_commit" != "$(git rev-parse HEAD)" ]; then
              {
                echo "tag=${tag}"
                echo "publish=false"
                echo "verify=false"
                echo "create-tag=false"
              } >> "$GITHUB_OUTPUT"
              echo "${tag} is already published from an earlier main commit."
              exit 0
            fi

            if gh release view "${tag}" >/dev/null 2>&1; then
              {
                echo "tag=${tag}"
                echo "publish=false"
                echo "verify=true"
                echo "create-tag=false"
              } >> "$GITHUB_OUTPUT"
              echo "${tag} is already released; Packagist will be verified."
              exit 0
            fi

            {
              echo "tag=${tag}"
              echo "publish=true"
              echo "verify=true"
              echo "create-tag=false"
            } >> "$GITHUB_OUTPUT"
            echo "${tag} already exists on this commit; release publication will resume."
            exit 0
          fi

          php tests/Support/validate-release-tag.php "${tag}"
          {
            echo "tag=${tag}"
            echo "publish=true"
            echo "verify=true"
            echo "create-tag=true"
          } >> "$GITHUB_OUTPUT"
          echo "${tag} will be published from $(git rev-parse HEAD)."

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: composer update --prefer-stable --prefer-dist --with-all-dependencies --no-interaction --no-progress

      - name: Validate release tag and changelog
        if: steps.release.outputs.publish == 'true'
        run: php tests/Support/validate-release-tag.php "${{ steps.release.outputs.tag }}"

      - name: Run source quality gate
        if: steps.release.outputs.publish == 'true'
        run: composer check

      - name: Build release archive
        if: steps.release.outputs.publish == 'true'
        run: |
          mkdir --parents dist
          composer archive --format=zip --dir=dist --file="laravel-config-cache-guard-${{ steps.release.outputs.tag }}"

      - name: Test the exact release archive
        if: steps.release.outputs.publish == 'true'
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: php tests/E2E/LaravelConfigCacheGuardE2e.php --package-archive="dist/laravel-config-cache-guard-${{ steps.release.outputs.tag }}.zip"

      - name: Build release checksum
        if: steps.release.outputs.publish == 'true'
        run: |
          cd dist
          sha256sum ./*.zip > SHA256SUMS

      - name: Upload workflow artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laravel-config-cache-guard-${{ steps.release.outputs.tag }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attest release provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS

      - name: Create annotated release tag
        if: steps.release.outputs.create-tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${{ steps.release.outputs.tag }}" --message "${{ steps.release.outputs.tag }}" "${GITHUB_SHA}"
          git push origin "refs/tags/${{ steps.release.outputs.tag }}"

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ steps.release.outputs.tag }}"
          dist/*.zip
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "${{ steps.release.outputs.tag }}"

      - name: Verify Packagist publication
        if: steps.release.outputs.verify == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "https://repo.packagist.org/p2/codegenie-be/laravel-config-cache-guard.json" \
              | jq --exit-status \
                --arg tag "${RELEASE_TAG}" \
                --arg commit "${RELEASE_COMMIT}" \
                '.packages["codegenie-be/laravel-config-cache-guard"] | any(.version == $tag and .source.reference == $commit)' >/dev/null; then
              echo "Packagist exposes ${RELEASE_TAG} at ${RELEASE_COMMIT}."
              exit 0
            fi

            echo "Waiting for Packagist (${attempt}/30)..."
            sleep 10
          done

          echo "Packagist did not expose ${RELEASE_TAG} at ${RELEASE_COMMIT} within five minutes."
          exit 1
