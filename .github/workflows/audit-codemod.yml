name: One-shot audit codemod

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/codebase-polish-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply reviewed repository improvements
        shell: bash
        run: |
          python <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path.cwd()

          retry_script = r'''#!/bin/sh
          set -eu

          if [ "$#" -lt 1 ]; then
              echo "Usage: composer-retry.sh <composer-command> [arguments ...]" >&2
              exit 2
          fi

          max_attempts="${COMPOSER_RETRY_MAX_ATTEMPTS:-3}"
          base_delay="${COMPOSER_RETRY_BASE_DELAY:-10}"

          case "$max_attempts" in
              ''|*[!0-9]*)
                  echo "COMPOSER_RETRY_MAX_ATTEMPTS must be a positive integer." >&2
                  exit 2
                  ;;
          esac

          case "$base_delay" in
              ''|*[!0-9]*)
                  echo "COMPOSER_RETRY_BASE_DELAY must be a non-negative integer." >&2
                  exit 2
                  ;;
          esac

          if [ "$max_attempts" -lt 1 ]; then
              echo "COMPOSER_RETRY_MAX_ATTEMPTS must be at least 1." >&2
              exit 2
          fi

          attempt=1

          while :; do
              if composer "$@"; then
                  exit 0
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Composer command failed after ${max_attempts} attempts: composer $*" >&2
                  exit 1
              fi

              delay=$((base_delay * attempt))
              echo "Composer command failed; retrying in ${delay} seconds (${attempt}/${max_attempts}): composer $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
          done
          '''
          retry_script = '\n'.join(line[10:] if line.startswith('          ') else line for line in retry_script.splitlines()) + '\n'

          retry_test = r'''#!/bin/sh
          set -eu

          repository_root=$(CDPATH= cd -- "$(dirname -- "$0")/../.." && pwd)
          retry_script="${repository_root}/tests/Support/composer-retry.sh"
          temporary_directory=$(mktemp -d 2>/dev/null || mktemp -d -t composer-retry)
          trap 'rm -rf "$temporary_directory"' EXIT HUP INT TERM

          fake_bin="${temporary_directory}/bin"
          mkdir -p "$fake_bin"

          cat > "${fake_bin}/composer" <<'SH'
          #!/bin/sh
          set -eu

          count_file="${COMPOSER_FAKE_COUNT_FILE:?}"
          succeed_on="${COMPOSER_FAKE_SUCCEED_ON:?}"
          count=0

          if [ -f "$count_file" ]; then
              count=$(cat "$count_file")
          fi

          count=$((count + 1))
          printf '%s' "$count" > "$count_file"
          printf '%s\n' "$*" >> "${COMPOSER_FAKE_ARGUMENTS_FILE:?}"

          if [ "$count" -ge "$succeed_on" ]; then
              exit 0
          fi

          exit 1
          SH
          chmod +x "${fake_bin}/composer"

          count_file="${temporary_directory}/count"
          arguments_file="${temporary_directory}/arguments"

          PATH="${fake_bin}:$PATH" \
          COMPOSER_FAKE_COUNT_FILE="$count_file" \
          COMPOSER_FAKE_ARGUMENTS_FILE="$arguments_file" \
          COMPOSER_FAKE_SUCCEED_ON=3 \
          COMPOSER_RETRY_MAX_ATTEMPTS=3 \
          COMPOSER_RETRY_BASE_DELAY=0 \
              sh "$retry_script" install --prefer-dist --no-interaction

          test "$(cat "$count_file")" = '3'
          test "$(wc -l < "$arguments_file" | tr -d ' ')" = '3'
          test "$(sed -n '1p' "$arguments_file")" = 'install --prefer-dist --no-interaction'

          : > "$count_file"
          : > "$arguments_file"

          if PATH="${fake_bin}:$PATH" \
              COMPOSER_FAKE_COUNT_FILE="$count_file" \
              COMPOSER_FAKE_ARGUMENTS_FILE="$arguments_file" \
              COMPOSER_FAKE_SUCCEED_ON=99 \
              COMPOSER_RETRY_MAX_ATTEMPTS=2 \
              COMPOSER_RETRY_BASE_DELAY=0 \
                  sh "$retry_script" update --prefer-lowest; then
              echo 'Expected a permanently failing Composer command to fail.' >&2
              exit 1
          fi

          test "$(cat "$count_file")" = '2'

          if COMPOSER_RETRY_MAX_ATTEMPTS=0 sh "$retry_script" install >/dev/null 2>&1; then
              echo 'Expected zero retry attempts to be rejected.' >&2
              exit 1
          fi

          if COMPOSER_RETRY_BASE_DELAY=invalid sh "$retry_script" install >/dev/null 2>&1; then
              echo 'Expected an invalid retry delay to be rejected.' >&2
              exit 1
          fi
          '''
          retry_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in retry_test.splitlines()) + '\n'

          support = root / 'tests' / 'Support'
          support.mkdir(parents=True, exist_ok=True)
          (support / 'composer-retry.sh').write_text(retry_script, encoding='utf-8', newline='\n')
          (support / 'test-composer-retry.sh').write_text(retry_test, encoding='utf-8', newline='\n')

          old_retry = support / 'composer-update-retry.sh'
          if old_retry.exists():
              old_retry.unlink()

          workflow_path = root / '.github' / 'workflows' / 'tests.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              'sh tests/Support/composer-update-retry.sh ',
              'sh tests/Support/composer-retry.sh update ',
          )
          workflow = re.sub(
              r'(?m)^(\s*run:\s*)composer update\b',
              r'\1sh tests/Support/composer-retry.sh update',
              workflow,
          )
          workflow = re.sub(
              r'(?m)^(\s*run:\s*)composer install\b',
              r'\1sh tests/Support/composer-retry.sh install',
              workflow,
          )
          workflow = workflow.replace(
              "sh -lc 'composer require",
              "sh -lc 'composer require",
          )
          workflow = workflow.replace(
              ' && composer update --prefer-stable',
              ' && sh tests/Support/composer-retry.sh update --prefer-stable',
          )
          workflow = workflow.replace(
              'run: composer install --prefer-dist --no-interaction --no-progress',
              'run: sh tests/Support/composer-retry.sh install --prefer-dist --no-interaction --no-progress',
          )
          if 'composer-update-retry.sh' in workflow:
              raise SystemExit('The workflow still references the retired update-only retry helper.')
          workflow_path.write_text(workflow, encoding='utf-8', newline='\n')

          composer_path = root / 'composer.json'
          composer = json.loads(composer_path.read_text(encoding='utf-8'))
          scripts = composer.setdefault('scripts', {})
          scripts['check:composer-retry'] = 'sh tests/Support/test-composer-retry.sh'
          check = scripts.get('check')
          if isinstance(check, list):
              if '@check:composer-retry' not in check:
                  insertion = check.index('@check:distribution') if '@check:distribution' in check else len(check)
                  check.insert(insertion, '@check:composer-retry')
          elif isinstance(check, str):
              scripts['check'] = [check, '@check:composer-retry']
          else:
              raise SystemExit('composer.json has an unsupported scripts.check structure.')
          composer_path.write_text(json.dumps(composer, indent=4, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')

          validate_path = root / 'tests' / 'Support' / 'validate.php'
          validate = validate_path.read_text(encoding='utf-8')
          validate = validate.replace('composer-update-retry.sh', 'composer-retry.sh')
          validate = validate.replace(
              'composer update --prefer-lowest --prefer-stable',
              'composer-retry.sh update --prefer-lowest --prefer-stable',
          )
          validate_path.write_text(validate, encoding='utf-8', newline='\n')

          policy_test = root / 'tests' / 'Feature' / 'ComposerRetryPolicyTest.php'
          policy_test.write_text(r'''<?php

          declare(strict_types=1);

          it('routes network-facing Composer installs and updates through the bounded retry helper', function (): void {
              $workflow = file_get_contents(__DIR__.'/../../.github/workflows/tests.yml');
              $composer = json_decode((string) file_get_contents(__DIR__.'/../../composer.json'), true, 512, JSON_THROW_ON_ERROR);

              expect($workflow)
                  ->toBeString()
                  ->not->toContain('composer-update-retry.sh')
                  ->toContain('composer-retry.sh install')
                  ->toContain('composer-retry.sh update');

              expect(preg_match('/^\\s*run:\\s+composer (?:install|update)\\b/m', $workflow))->toBe(0);
              expect($composer['scripts']['check:composer-retry'] ?? null)
                  ->toBe('sh tests/Support/test-composer-retry.sh');
              expect($composer['scripts']['check'] ?? [])
                  ->toContain('@check:composer-retry');
          });
          ''').replace('          ', ''), encoding='utf-8', newline='\n')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = (
              '- Generalized the bounded Composer network retry helper so both `install` and `update` phases '\
              'use the same validated retry policy, including Linux E2E and release dependency installation.\n'
              '- Added executable regression coverage for transient success, permanent failure, argument forwarding '\
              'and invalid retry configuration, and made the repository quality gate enforce that policy.\n'
          )
          if entry.splitlines()[0] not in changelog:
              changelog = changelog.replace('## Unreleased\n', '## Unreleased\n\n' + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8', newline='\n')

          marker = root / '.audit-branch-marker'
          if marker.exists():
              marker.unlink()

          self_path = root / '.github' / 'workflows' / 'audit-codemod.yml'
          if self_path.exists():
              self_path.unlink()
          PY

      - name: Commit generated improvements
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit --message 'Harden Composer dependency retry policy'
          git push origin HEAD:${{ github.head_ref }}
