name: Hosting compatibility report
description: Share a successful or unsuccessful cPanel, Plesk, FTP or shared-hosting setup.
title: "[Hosting]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Hosting reports help improve documentation. Share only public or anonymized details and never include credentials or `.env` contents.
  - type: input
    id: environment
    attributes:
      label: Hosting environment
      placeholder: cPanel, Plesk, DirectAdmin, FTP-only, other shared hosting
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Package, PHP and Laravel versions
      placeholder: Package 1.3.1 / PHP 8.4 / Laravel 13
    validations:
      required: true
  - type: dropdown
    id: process_control
    attributes:
      label: Is bounded process control (`proc_open`) available?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: cli
    attributes:
      label: Is a supported PHP CLI available?
      options:
        - "Yes"
        - "No"
        - Unknown
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Deployment workflow and observed result
      description: Explain the relevant steps without server identifiers or secrets.
    validations:
      required: true
  - type: checkboxes
    id: permission
    attributes:
      label: Publication check
      options:
        - label: I am authorized to publish these anonymized details and removed all sensitive information.
          required: true
